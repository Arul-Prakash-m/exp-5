<!DOCTYPE html>
<html>
<head>
    <title>Birthday Cake Order Form</title>
    <script src="Q6.js"></script>

<body>

<h1>Birthday Cake Order Form</h1>

1/2kg Cakes:
<input type="text" id="small"><br><br>

1kg Cakes:
<input type="text" id="medium"><br><br>

2kg Cakes:
<input type="text" id="large"><br><br>

Tip:

<input type="radio" name="tip" value="10">10%
<input type="radio" name="tip" value="15" checked>15%
<input type="radio" name="tip" value="20">20%

<br><br>

<button id="submit">
Calculate Order
</button>

<p>
Cost of Order:
₹<span id="price"></span>
</p>

</body>
